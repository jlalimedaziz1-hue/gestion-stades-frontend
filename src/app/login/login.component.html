<div class="container mt-5" style="max-width: 420px"><h2 class="mb-4">Connexion</h2>@if(error){<div class="alert alert-danger">{{error}}</div>}<form #loginForm="ngForm" (ngSubmit)="login()"><div class="mb-3"><label for="username" class="form-label">Nom d’utilisateur</label><input id="username" name="username" class="form-control" [(ngModel)]="username" required></div><div class="mb-3"><label for="password" class="form-label">Mot de passe</label><input id="password" name="password" type="password" class="form-control" [(ngModel)]="password" required></div><button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid||loading">Se connecter</button></form></div>
