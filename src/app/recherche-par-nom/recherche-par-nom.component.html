            <input [(ngModel)]="searchTerm" (ngModelChange)="rechercherStades($event)" name="searchTerm" class="form-control">

    </form>

    <div class="card shadow mb-4">                   
      <div class="card-body"> 
       <table class="table table-striped">
          <tr> <th>Id</th><th>Nom du stade</th> <th>Capacité</th>  <th>Date ouverture</th> <th>Type de stade</th></tr>          
           @for (stade of stades; track stade.idStade)
           {
            
            <tbody >
              <tr >
                  <td>{{stade.idStade}}</td>
                 <td>{{stade.nomStade}}</td>
                 <td>{{stade.capaciteStade}}</td>
                 <td>{{stade.dateOuverture | date:'dd/MM/yyyy'}}</td>
  
                 @if(stade.categorie){ 
                  <td>{{stade.categorie.nomCat}}</td>  }
                 @else {
                  <td>Aucun type</td>
                  }
  
                 <!-- <td><a class="btn btn-danger" (click)="supprimerStade(stade)">Supprimer</a></td> 
                 <td><a class="btn btn-success" [routerLink]="['/updateStade',stade.idStade]">Modifier</a></td> -->
               </tr>                                    
            </tbody>
           }   
        
  
      </table>
      </div>
    </div>
  </div>
