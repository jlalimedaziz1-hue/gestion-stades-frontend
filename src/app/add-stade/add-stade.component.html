<div class="container">
    <div>
      <h2>Ajouter un stade :</h2>             
    </div>
         <form #stadeForm="ngForm" (ngSubmit)="addStade()"> 
         
             <div class="col-sm-4 col-md-4 col-lg-4" >
               <label >Nom du stade</label>
               <input  type="text"[(ngModel)]= "newStade.nomStade"  
                   name="nomStade" class="form-control" required>
             </div>

             <div class="col-sm-2 col-md-2 col-lg-2">
               <label >Capacité du stade</label>
               <input type="number" min="1" [(ngModel)]= "newStade.capaciteStade"  
                   name="capaciteStade" class="form-control" required>
             </div>

             <div class="col-sm-4 col-md-4 col-lg-4">
                 <label >Date ouverture</label>
                 <input type="date"  [(ngModel)]= "newStade.dateOuverture" 
                     name="dateOuverture" class="form-control" required>
             </div>

            <div class="col-sm-4 col-md-4 col-lg-4">
              <label>Type de stade</label>
            
              <select class="form-control form-control-lg" id="idCat" name="idCat" [(ngModel)]="newIdCat" required>
                 @for(cat of categories; track cat.idCat){
                   <option  [value]="cat.idCat">  {{cat.nomCat}}
                    </option>
                  }
              </select>
            </div>
         
              
       <div class="mt-2">
  <button type="submit" [disabled]="stadeForm.invalid" class="btn btn-success">Ajouter</button>
       </div>   

     
         </form>
</div>
