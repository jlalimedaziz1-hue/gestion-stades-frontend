<div class="container">

  <div class="container">
    <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
      <label>Type de stade </label>
      <select class="form-control form-control-lg" id="idCat" name="idCat" [(ngModel)]="IdCategorie"  (change)="onChange()">
        @for(cat of categories;track cat.idCat)
        {
        <option value="{{cat.idCat}}"> {{cat.nomCat}} </option>
        }
      </select>
    </div>


  <div class="card shadow mb-4">                   
    <div class="card-body"> 
     <table class="table table-striped">
        <tr> <th>Id</th><th>Nom du stade</th> <th>Capacité</th>  <th>Date ouverture</th> <th>Type de stade</th></tr>          
         @for (stade of stades; track stade.idStade)
         {
          
          <tbody >
            <tr >
                <td>{{stade.idStade}}</td>
               <td>{{stade.nomStade}}</td>
               <td>{{stade.capaciteStade}}</td>
               <td>{{stade.dateOuverture | date:'dd/MM/yyyy'}}</td>

               @if(stade.categorie){ 
                <td>{{stade.categorie.nomCat}}</td>  }
               @else {
                <td>Aucun type</td>
                }

               <!-- <td><a class="btn btn-danger" (click)="supprimerStade(stade)">Supprimer</a></td> 
               <td><a class="btn btn-success" [routerLink]="['/updateStade',stade.idStade]">Modifier</a></td> -->
             </tr>                                    
          </tbody>
         }   
      

    </table>
    </div>
  </div>
</div>
